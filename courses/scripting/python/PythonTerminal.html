<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Terminal - FOC</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
:root{--bg:#0a0e17;--card:#141925;--border:#2a3650;--text:#e2e8f0;--muted:#64748b;--cyan:#06b6d4;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:.5rem 1rem;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.top-bar a{color:var(--muted);text-decoration:none;font-size:.8rem}
.top-bar a:hover{color:var(--cyan)}
.top-bar h1{font-size:1rem;color:var(--cyan)}
.top-bar .score-area{font-size:.75rem;color:var(--muted)}
.top-bar .score-area .v{color:var(--cyan);font-weight:700}
.challenge-panel{background:var(--card);border-bottom:1px solid var(--border);padding:.6rem 1rem;flex-shrink:0;display:flex;gap:1rem;align-items:flex-start;min-height:0}
.challenge-panel .ch-info{flex:1;min-width:0}
.challenge-panel .ch-title{font-size:.82rem;font-weight:700;color:var(--cyan);margin-bottom:.25rem}
.challenge-panel .ch-desc{font-size:.75rem;color:var(--muted);line-height:1.4}
.challenge-panel .ch-sig{font-size:.75rem;color:#c9d1d9;background:#0d1117;padding:.4rem .6rem;border-radius:4px;margin-top:.3rem;white-space:pre;overflow-x:auto}
.challenge-panel .ch-tests{font-size:.7rem;color:var(--muted);margin-top:.25rem}
.challenge-panel .ch-nav{display:flex;gap:.3rem;flex-shrink:0;align-items:center}
.ch-nav button{font-family:inherit;font-size:.72rem;padding:.3rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--muted);cursor:pointer}
.ch-nav button:hover{border-color:var(--cyan);color:var(--cyan)}
.ch-nav .ch-counter{font-size:.72rem;color:var(--muted);white-space:nowrap}
#terminal-container{flex:1;min-height:0;min-width:0;padding:2px}
.workspace{flex:1;min-height:0;display:flex}
.splitter{width:5px;flex-shrink:0;cursor:col-resize;background:var(--border)}
.splitter:hover,.splitter.dragging{background:var(--cyan)}
#var-pane{width:420px;min-width:240px;max-width:70vw;flex-shrink:0;display:flex;flex-direction:column;background:var(--card);font-size:.75rem}
body.vx-hidden #var-pane,body.vx-hidden .splitter{display:none}
@media (max-width:900px){.workspace{flex-direction:column}.splitter{display:none}#var-pane{width:auto;max-width:none;height:40vh;border-top:1px solid var(--border)}}
.vx-header{display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem;border-bottom:1px solid var(--border)}
.vx-title{color:var(--cyan);font-weight:700;font-size:.8rem}
.vx-tools{display:flex;gap:.3rem}
.vx-tools button,.vx-actions button,.vx-modal button{font-family:inherit;font-size:.68rem;padding:.2rem .45rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--muted);cursor:pointer}
.vx-tools button:hover,.vx-actions button:hover,.vx-modal button:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.vx-modal button:disabled{opacity:.4;cursor:default}
.vx-menu-wrap{position:relative}
.vx-menu{position:absolute;right:0;top:110%;z-index:20;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.vx-menu label{display:flex;gap:.4rem;align-items:center;padding:.2rem 0;color:var(--text);cursor:pointer}
.vx-menu hr{border:0;border-top:1px solid var(--border);margin:.3rem 0}
.vx-body{flex:1;min-height:0;overflow:auto}
.vx-table{width:100%;border-collapse:collapse;table-layout:fixed}
.vx-table th{position:sticky;top:0;background:#0d1117;color:var(--muted);font-weight:600;text-align:left;padding:.3rem .5rem;border-bottom:1px solid var(--border)}
.vx-table th:nth-child(1){width:28%}.vx-table th:nth-child(2){width:18%}.vx-table th:nth-child(3){width:12%}
.vx-table td{padding:.25rem .5rem;border-bottom:1px solid rgba(42,54,80,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.vx-row{cursor:pointer}.vx-row:hover{background:rgba(6,182,212,.07)}
.vx-name{color:var(--text);font-weight:600}
.vx-type{color:var(--blue)}.vx-size{color:var(--amber)}
.vx-value{position:relative;color:#c9d1d9}
.vx-value-text{display:block;overflow:hidden;text-overflow:ellipsis}
.vx-actions{display:none;position:absolute;right:.3rem;top:.15rem;gap:.2rem;background:var(--card)}
.vx-row:hover .vx-actions{display:flex}
.vx-twisty{display:inline-block;width:1em;color:var(--cyan)}
.vx-count{color:var(--muted);font-weight:400;margin-left:.3rem;font-size:.65rem}
.vx-hist{cursor:pointer;background:rgba(13,17,23,.6)}.vx-hist:hover{background:rgba(6,182,212,.07)}
.vx-hist-line{color:var(--muted);padding-left:1.6rem!important}
.vx-hist-value{color:#c9d1d9}
.vx-empty{color:var(--muted);text-align:center;padding:1.5rem!important;white-space:normal!important}
.vx-footer{padding:.3rem .6rem;border-top:1px solid var(--border);color:var(--muted)}
.vx-error{color:var(--red)}
.vx-overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,23,.75);display:flex;align-items:center;justify-content:center}
.vx-overlay[hidden]{display:none}
.vx-modal{background:var(--card);border:1px solid var(--border);border-radius:8px;width:min(1100px,92vw);max-height:86vh;display:flex;flex-direction:column;font-size:.78rem}
.vx-modal-head{display:flex;justify-content:space-between;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--border)}
.vx-modal-title{color:var(--cyan);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vx-modal-meta{padding:.4rem .8rem;color:var(--muted)}
.vx-modal-meta:empty{display:none}
.vx-modal-body{flex:1;min-height:0;overflow:auto;padding:0 .8rem .6rem}
.vx-modal-foot{display:flex;gap:1rem;align-items:center;justify-content:flex-end;padding:.5rem .8rem;border-top:1px solid var(--border);color:var(--muted)}
.vx-pager{display:flex;gap:.4rem;align-items:center}
.vx-grid{border-collapse:collapse;font-size:.75rem}
.vx-grid th,.vx-grid td{border:1px solid var(--border);padding:.2rem .5rem;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.vx-grid thead th{position:sticky;top:0;background:#0d1117;color:var(--cyan)}
.vx-grid .vx-idx{background:#0d1117;color:var(--muted);text-align:right}
.vx-grid .vx-num{text-align:right;color:var(--amber)}
.vx-text{background:#0d1117;padding:.6rem;border-radius:4px;white-space:pre-wrap;word-break:break-word;color:#c9d1d9}
.vx-src-line{white-space:pre}
.vx-src-hit{background:rgba(245,158,11,.18);outline:1px solid rgba(245,158,11,.5)}
.vx-src-no{display:inline-block;width:3em;color:var(--muted);user-select:none}
.vx-input{width:100%;font-family:inherit;font-size:.8rem;padding:.45rem .6rem;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;margin-top:.4rem}
.vx-input:focus{outline:none;border-color:var(--cyan)}
.loading-overlay{position:fixed;inset:0;background:rgba(10,14,23,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.loading-overlay h2{color:var(--cyan);font-size:1.2rem;margin-bottom:.5rem}
.loading-overlay p{color:var(--muted);font-size:.82rem}
.loading-overlay .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.mode-toggle{display:flex;gap:.3rem;flex-shrink:0}
.mode-toggle button{font-family:inherit;font-size:.7rem;padding:.25rem .5rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--muted);cursor:pointer}
.mode-toggle button.active{color:var(--cyan);border-color:var(--cyan);background:rgba(6,182,212,.08)}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <h2>Loading Python + IPython</h2>
  <p>Downloading Pyodide (CPython in WebAssembly) and IPython...</p>
  <p id="load-status" style="margin-top:.5rem;color:var(--cyan);font-size:.75rem"></p>
</div>

<div class="top-bar">
  <a href="../../../hub/index.html">&larr; Home</a>
  <h1>Python Terminal</h1>
  <div class="score-area">
    <span class="mode-toggle">
      <button id="mode-challenge" class="active" onclick="setMode('challenge')">Challenges</button>
      <button id="mode-repl" onclick="setMode('repl')">Free REPL</button>
      <button id="vx-toggle" class="active" onclick="toggleVarPane()">Variables</button>
    </span>
    &nbsp; SCORE: <span class="v" id="score">0</span> / <span id="total">20</span>
  </div>
</div>

<div class="challenge-panel" id="challenge-panel">
  <div class="ch-info">
    <div class="ch-title" id="ch-title">Challenge 1: add(a, b)</div>
    <div class="ch-desc" id="ch-desc">Return the sum of a and b</div>
    <div class="ch-sig" id="ch-sig">def add(a, b):
    # your code here</div>
    <div class="ch-tests" id="ch-tests">add(2,3)==5  add(-1,1)==0  add(100,250)==350</div>
  </div>
  <div class="ch-nav">
    <span class="ch-counter" id="ch-counter">1 / 20</span>
    <button onclick="prevChallenge()">&laquo; Prev</button>
    <button onclick="nextChallenge()">Next &raquo;</button>
  </div>
</div>

<div class="workspace" id="workspace">
  <div id="terminal-container"></div>
  <div class="splitter" id="splitter" title="Drag to resize"></div>
  <div id="var-pane"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="../shared/line-editor.js"></script>
<script src="var-pane.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
// ============ CHALLENGES ============
const CHALLENGES = [
  { name:'add', sig:'def add(a, b):', desc:'Return the sum of a and b',
    tests:[['add(2, 3)','5'],['add(-1, 1)','0'],['add(100, 250)','350'],['add(0, 0)','0']]},
  { name:'celsius_to_fahrenheit', sig:'def celsius_to_fahrenheit(c):', desc:'Convert Celsius to Fahrenheit (F = C * 9/5 + 32)',
    tests:[['celsius_to_fahrenheit(0)','32.0'],['celsius_to_fahrenheit(100)','212.0'],['celsius_to_fahrenheit(-40)','-40.0']]},
  { name:'count_evens', sig:'def count_evens(numbers):', desc:'Count how many even numbers are in the list',
    tests:[['count_evens([1,2,3,4])','2'],['count_evens([2,4,6,8])','4'],['count_evens([1,3,5])','0'],['count_evens([])','0']]},
  { name:'reverse_string', sig:'def reverse_string(s):', desc:'Return the reversed string',
    tests:[['reverse_string("hello")','\'olleh\''],['reverse_string("a")','\'a\''],['reverse_string("")','\'\''],['reverse_string("Python")','\'nohtyP\'']]},
  { name:'is_palindrome', sig:'def is_palindrome(s):', desc:'Return True if string is a palindrome',
    tests:[['is_palindrome("radar")','True'],['is_palindrome("hello")','False'],['is_palindrome("")','True'],['is_palindrome("level")','True']]},
  { name:'count_vowels', sig:'def count_vowels(s):', desc:'Count vowels (a,e,i,o,u) case-insensitive',
    tests:[['count_vowels("hello")','2'],['count_vowels("sky")','0'],['count_vowels("aeiou")','5'],['count_vowels("AEiOu")','5']]},
  { name:'multiply_all', sig:'def multiply_all(numbers):', desc:'Return the product of all numbers in the list (1 for empty)',
    tests:[['multiply_all([1,2,3,4])','24'],['multiply_all([5])','5'],['multiply_all([2,0,5])','0']]},
  { name:'max_of_three', sig:'def max_of_three(a, b, c):', desc:'Return the largest of three numbers',
    tests:[['max_of_three(1,2,3)','3'],['max_of_three(3,2,1)','3'],['max_of_three(-1,0,-5)','0'],['max_of_three(5,5,5)','5']]},
  { name:'sum_digits', sig:'def sum_digits(n):', desc:'Return the sum of all digits in n',
    tests:[['sum_digits(123)','6'],['sum_digits(0)','0'],['sum_digits(999)','27'],['sum_digits(1001)','2']]},
  { name:'average', sig:'def average(lst):', desc:'Return the average of numbers (0.0 for empty list)',
    tests:[['average([2,4,6])','4.0'],['average([1])','1.0'],['average([1,2,3,4])','2.5'],['average([])','0.0']]},
  { name:'sort_numbers', sig:'def sort_numbers(lst):', desc:'Return a new sorted list (ascending)',
    tests:[['sort_numbers([3,1,2])','[1, 2, 3]'],['sort_numbers([5])','[5]'],['sort_numbers([])','[]'],['sort_numbers([10,-1])','[-1, 10]']]},
  { name:'word_count', sig:'def word_count(text):', desc:'Return a dict with word frequencies',
    tests:[['word_count("hello world hello")','{"hello": 2, "world": 1}'],['word_count("a a a")','{"a": 3}']]},
  { name:'filter_evens', sig:'def filter_evens(lst):', desc:'Return a list with only the even numbers',
    tests:[['filter_evens([1,2,3,4])','[2, 4]'],['filter_evens([])','[]'],['filter_evens([1,3,5])','[]'],['filter_evens([0,2,8])','[0, 2, 8]']]},
  { name:'flatten', sig:'def flatten(matrix):', desc:'Flatten a 2D list into a 1D list',
    tests:[['flatten([[1,2],[3,4]])','[1, 2, 3, 4]'],['flatten([[5]])','[5]'],['flatten([[]])','[]'],['flatten([[1],[2,3]])','[1, 2, 3]']]},
  { name:'common_elements', sig:'def common_elements(a, b):', desc:'Return sorted list of items found in both lists',
    tests:[['common_elements([1,2,3],[2,3,4])','[2, 3]'],['common_elements([],[1])','[]'],['common_elements([1,2],[1,2,3])','[1, 2]']]},
  { name:'get_keys', sig:'def get_keys(d):', desc:'Return a list of dictionary keys',
    tests:[['get_keys({"a":1,"b":2})','[\'a\', \'b\']'],['get_keys({})','[]']]},
  { name:'invert_dict', sig:'def invert_dict(d):', desc:'Return a dictionary with keys and values swapped',
    tests:[['invert_dict({"a":1,"b":2})','{1: \'a\', 2: \'b\'}'],['invert_dict({})','{}'],['invert_dict({"x":10})','{10: \'x\'}']]},
  { name:'capitalize_words', sig:'def capitalize_words(sentence):', desc:'Capitalize the first letter of each word',
    tests:[['capitalize_words("hello world")','\'Hello World\''],['capitalize_words("hi there")','\'Hi There\'']]},
  { name:'square_dict', sig:'def square_dict(nums):', desc:'Return dict mapping each number to its square',
    tests:[['square_dict([1,2,3])','{1: 1, 2: 4, 3: 9}'],['square_dict([])','{}'],['square_dict([0])','{0: 0}']]},
  { name:'find_primes', sig:'def find_primes(n):', desc:'Return list of all prime numbers up to n',
    tests:[['find_primes(10)','[2, 3, 5, 7]'],['find_primes(1)','[]'],['find_primes(2)','[2]'],['find_primes(20)','[2, 3, 5, 7, 11, 13, 17, 19]']]},
];

// ============ CONFIG ============
const PYODIDE_INDEX_URL = 'https://cdn.jsdelivr.net/pyodide/v314.0.7/full/';
const PYTHON_PACKAGES = ['ipython'];
const HIGHLIGHT_STYLE = 'github-dark';
const IPYTHON_PROMPT_DOTS = '...: ';
const MODE = Object.freeze({ CHALLENGE: 'challenge', REPL: 'repl' });
const VAREXPLORER_SOURCE = 'varexplorer.py';
const PANE_STORAGE_KEY = 'foc.varexplorer.layout';
const PANE_MIN_WIDTH = 240;
const TERMINAL_MIN_WIDTH = 320;
const COMMANDS = Object.freeze({
  TEST: 'test()', NEXT: 'next()', PREV: 'prev()', HELP: 'help()',
  RESET: 'reset()', CLEAR: 'clear()', CHALLENGE: 'challenge()',
});
const CHALLENGE_JUMP = /^challenge\((\d+)\)$/;

// ============ STATE ============
let currentChallenge = 0;
let score = 0;
let passed = new Set();
let pyodide = null;
let py = null;      // Python helper functions, see PYTHON_BOOTSTRAP
let term = null;
let fitAddon = null;
let editor = null;
let currentMode = MODE.CHALLENGE;
let varPane = null;

// ============ PYTHON BOOTSTRAP ============
// Runs once inside Pyodide. User code runs in the IPython shell's own
// namespace; these helpers live outside it so %who stays clean.
const PYTHON_BOOTSTRAP = `
import sys, json, types
from IPython.core.interactiveshell import InteractiveShell
from IPython.core.completer import provisionalcompleter
from traitlets.config import Config
from pygments import highlight as _pyg_highlight
from pygments.lexers import PythonLexer
from pygments.formatters import TerminalTrueColorFormatter
from pygments.util import ClassNotFound

_cfg = Config()
_cfg.HistoryManager.hist_file = ':memory:'
shell = InteractiveShell.instance(config=_cfg)
shell.Completer.use_jedi = False

def _out_prompt(self):
    sys.stdout.write(self.shell.separate_out)
    if self.do_full_cache:
        n = self.shell.execution_count - 1
        sys.stdout.write(f'\\x1b[31mOut[\\x1b[1;31m{n}\\x1b[0;31m]:\\x1b[0m ')
shell.displayhook.write_output_prompt = types.MethodType(_out_prompt, shell.displayhook)

_lexer = PythonLexer(stripnl=False, ensurenl=False)
try:
    _formatter = TerminalTrueColorFormatter(style=HIGHLIGHT_STYLE)
except ClassNotFound:
    _formatter = TerminalTrueColorFormatter()

def execution_count():
    return shell.execution_count

async def run_cell(code):
    try:
        transformed, exc = shell.transform_cell(code), None
    except Exception:
        transformed, exc = code, sys.exc_info()
    try:
        await shell.run_cell_async(code, store_history=True,
                                   transformed_cell=transformed,
                                   preprocessing_exc_tuple=exc)
    finally:
        sys.stdout.flush()
        sys.stderr.flush()

def check_complete(code):
    status, indent = shell.check_complete(code)
    return json.dumps({"complete": status != "incomplete", "indent": indent or ""})

def complete(code, cursor):
    with provisionalcompleter():
        found = list(shell.Completer.completions(code, cursor))
    if not found:
        return json.dumps(None)
    start = min(c.start for c in found)
    end = max(c.end for c in found)
    matches = [code[start:c.start] + c.text + code[c.end:end] for c in found]
    return json.dumps({"start": start, "end": end, "matches": list(dict.fromkeys(matches))})

def highlight(code):
    return _pyg_highlight(code, _lexer, _formatter)

def has_callable(name):
    return callable(shell.user_ns.get(name))

def reset_name(name):
    shell.user_ns.pop(name, None)

def load_varexplorer(src):
    """Exec the Variable Explorer back end privately; return its call() entry point."""
    ns = {"__name__": "varexplorer", "get_ipython": lambda: shell}
    exec(compile(src, "varexplorer.py", "exec"), ns)
    return ns["call"]

def test_challenge(func_name, test_calls):
    """test_calls is JSON [[call_str, expected_repr], ...]."""
    results = []
    for call_str, expected in json.loads(test_calls):
        try:
            actual = repr(eval(call_str, shell.user_ns))
            ok = actual == expected or actual.replace("'", '"') == expected.replace("'", '"')
            results.append({"call": call_str, "expected": expected, "actual": actual, "passed": ok, "error": None})
        except Exception as e:
            results.append({"call": call_str, "expected": expected, "actual": None, "passed": False, "error": f"{type(e).__name__}: {e}"})
    return json.dumps(results)
`;

const PYTHON_HELPERS = ['execution_count', 'check_complete', 'complete', 'highlight',
                        'has_callable', 'reset_name', 'test_challenge'];

// ============ TERMINAL SETUP ============
function initTerminal() {
  term = new Terminal({
    theme: {
      background: '#0d1117',
      foreground: '#c9d1d9',
      cursor: '#06b6d4',
      cursorAccent: '#0d1117',
      selectionBackground: 'rgba(6,182,212,0.3)',
      black: '#0d1117',
      red: '#ef4444',
      green: '#10b981',
      yellow: '#f59e0b',
      blue: '#3b82f6',
      magenta: '#8b5cf6',
      cyan: '#06b6d4',
      white: '#c9d1d9',
      brightBlack: '#64748b',
      brightRed: '#f87171',
      brightGreen: '#34d399',
      brightYellow: '#fbbf24',
      brightBlue: '#60a5fa',
      brightMagenta: '#a78bfa',
      brightCyan: '#22d3ee',
      brightWhite: '#e2e8f0',
    },
    fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
    fontSize: 14,
    lineHeight: 1.4,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 5000,
    convertEol: true,
  });

  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal-container'));
  fitAddon.fit();
  new ResizeObserver(() => fitAddon.fit()).observe(document.getElementById('terminal-container'));

  term.write('\x1b[36m');
  term.write('  ____        _   _                   _____                   \r\n');
  term.write(' |  _ \\ _   _| |_| |__   ___  _ __  |_   _|__ _ __ _ __ ___  \r\n');
  term.write(' | |_) | | | | __| \'_ \\ / _ \\| \'_ \\   | |/ _ \\ \'__| \'_ ` _ \\ \r\n');
  term.write(' |  __/| |_| | |_| | | | (_) | | | |  | |  __/ |  | | | | | |\r\n');
  term.write(' |_|    \\__, |\\__|_| |_|\\___/|_| |_|  |_|\\___|_|  |_| |_| |_|\r\n');
  term.write('        |___/                                                 \r\n');
  term.write('\x1b[0m\r\n');
  term.write('\x1b[33mLoading Python + IPython (Pyodide)...\x1b[0m\r\n');
}

function inPrompt() {
  const n = py.execution_count();
  return `\x1b[32mIn [\x1b[1;32m${n}\x1b[0;32m]: \x1b[0m`;
}

function continuationPrompt(width) {
  return '\x1b[32m' + ' '.repeat(Math.max(0, width - IPYTHON_PROMPT_DOTS.length)) + IPYTHON_PROMPT_DOTS + '\x1b[0m';
}

function initEditor() {
  editor = new LineEditor(term, {
    prompt: inPrompt,
    continuationPrompt,
    multiline: true,
    isComplete: code => JSON.parse(py.check_complete(code)),
    complete: (code, cursor) => JSON.parse(py.complete(code, cursor)),
    highlight: code => py.highlight(code),
    onSubmit: handleCell,
  });
}

function writeLine(text) {
  editor ? editor.print(text) : term.write(text + '\r\n');
}

// ============ PYTHON EXECUTION ============
function setStatus(text) {
  document.getElementById('load-status').textContent = text;
}

async function initPyodide() {
  setStatus('Initializing Pyodide...');
  pyodide = await loadPyodide({ indexURL: PYODIDE_INDEX_URL });

  const decoder = new TextDecoder();
  const writer = {
    isatty: true,
    write: buf => { term.write(decoder.decode(buf, { stream: true })); return buf.length; },
    getTerminalSize: () => ({ rows: term.rows, columns: term.cols }),
  };
  pyodide.setStdout(writer);
  pyodide.setStderr(writer);

  setStatus('Installing IPython...');
  await pyodide.loadPackage(PYTHON_PACKAGES);

  setStatus('Starting IPython shell...');
  pyodide.globals.set('HIGHLIGHT_STYLE', HIGHLIGHT_STYLE);
  await pyodide.runPythonAsync(PYTHON_BOOTSTRAP);
  py = Object.fromEntries(PYTHON_HELPERS.map(name => [name, pyodide.globals.get(name)]));

  setStatus('Starting Variable Explorer...');
  await initVarPane();

  document.getElementById('loading').style.display = 'none';
  const versions = pyodide.runPython('import IPython; f"Python {sys.version.split()[0]} | IPython {IPython.__version__}"');
  term.write(`\x1b[32m${versions} (Pyodide) ready!\x1b[0m\r\n`);
  term.write('\x1b[90mType Python code directly. Use \x1b[36mtest()\x1b[90m to check your solution.\x1b[0m\r\n');
  term.write('\x1b[90mCommands: \x1b[36mtest()\x1b[90m  \x1b[36mnext()\x1b[90m  \x1b[36mprev()\x1b[90m  \x1b[36mhelp()\x1b[90m  \x1b[36mreset()\x1b[90m  \x1b[36mclear()\x1b[0m\r\n');
  term.write('\x1b[90mIPython: \x1b[36mobj?\x1b[90m  \x1b[36m%timeit\x1b[90m  \x1b[36m%who\x1b[90m  \x1b[36mTab\x1b[90m completes  \x1b[36mAlt+Enter\x1b[90m new line\x1b[0m\r\n');
  initEditor();
  showChallengeInTerminal();
  editor.prompt();
  term.focus();
}

async function executePython(code) {
  pyodide.globals.set('_foc_src', code);
  await pyodide.runPythonAsync('await run_cell(_foc_src)');
}

// ============ CELL HANDLING ============
const TERMINAL_COMMANDS = {
  [COMMANDS.TEST]: () => runTests(),
  [COMMANDS.NEXT]: () => nextChallenge(),
  [COMMANDS.PREV]: () => prevChallenge(),
  [COMMANDS.HELP]: () => showHelp(),
  [COMMANDS.RESET]: () => resetChallenge(),
  [COMMANDS.CLEAR]: () => editor.clearScreen(),
  [COMMANDS.CHALLENGE]: () => showChallengeInTerminal(),
};

async function handleCell(code) {
  const trimmed = code.trim();
  if (trimmed === '') return;
  if (TERMINAL_COMMANDS[trimmed]) { TERMINAL_COMMANDS[trimmed](); return; }
  const jump = trimmed.match(CHALLENGE_JUMP);
  if (jump) { jumpToChallenge(parseInt(jump[1], 10) - 1); return; }
  await executePython(code);
  varPane.refresh();
  term.write('\r\n');
}

// ============ CHALLENGE SYSTEM ============
function updateChallengePanel() {
  const ch = CHALLENGES[currentChallenge];
  document.getElementById('ch-title').textContent = `Challenge ${currentChallenge + 1}: ${ch.name}(...)`;
  document.getElementById('ch-desc').textContent = ch.desc;
  document.getElementById('ch-sig').textContent = ch.sig + '\n    # your code here';
  document.getElementById('ch-tests').textContent = ch.tests.map(t => `${t[0]} == ${t[1]}`).join('  |  ');
  document.getElementById('ch-counter').textContent = `${currentChallenge + 1} / ${CHALLENGES.length}`;
  document.getElementById('total').textContent = CHALLENGES.length;
}

function showChallengeInTerminal() {
  const ch = CHALLENGES[currentChallenge];
  const marker = passed.has(currentChallenge) ? '\x1b[32m [PASSED]\x1b[0m' : '';
  writeLine([
    '',
    `\x1b[36m--- Challenge ${currentChallenge + 1}/${CHALLENGES.length}: ${ch.name}(...) ---\x1b[0m${marker}`,
    `\x1b[90m${ch.desc}\x1b[0m`,
    `\x1b[33m${ch.sig}\x1b[0m`,
    `\x1b[90mTests: ${ch.tests.map(t => t[0] + '==' + t[1]).join(' | ')}\x1b[0m`,
    '',
  ].join('\n'));
}

function runTests() {
  const ch = CHALLENGES[currentChallenge];
  if (!py.has_callable(ch.name)) {
    writeLine(`\x1b[31mFunction '${ch.name}' not found. Define it first!\x1b[0m`);
    return;
  }

  const results = JSON.parse(py.test_challenge(ch.name, JSON.stringify(ch.tests)));
  const lines = results.map(r => r.passed
    ? `  \x1b[32m  ${r.call} == ${r.expected}\x1b[0m`
    : r.error
      ? `  \x1b[31m  ${r.call} raised: ${r.error}\x1b[0m`
      : `  \x1b[31m  ${r.call} returned ${r.actual}, expected ${r.expected}\x1b[0m`);
  const allPassed = results.every(r => r.passed);

  if (allPassed && !passed.has(currentChallenge)) {
    passed.add(currentChallenge);
    score++;
    document.getElementById('score').textContent = score;
  }
  writeLine([
    '',
    `\x1b[36mTesting ${ch.name}()...\x1b[0m`,
    ...lines,
    '',
    allPassed
      ? '\x1b[32m  All tests passed! Type next() for the next challenge.\x1b[0m'
      : '\x1b[33m  Some tests failed. Keep trying!\x1b[0m',
    '',
  ].join('\n'));
}

function jumpToChallenge(n) {
  if (n < 0 || n >= CHALLENGES.length) {
    writeLine(`\x1b[31mChallenge number out of range (1-${CHALLENGES.length})\x1b[0m`);
    return;
  }
  currentChallenge = n;
  updateChallengePanel();
  showChallengeInTerminal();
}

function nextChallenge() {
  if (currentChallenge < CHALLENGES.length - 1) { jumpToChallenge(currentChallenge + 1); return; }
  writeLine('\x1b[32mYou\'ve reached the last challenge! Score: ' + score + '/' + CHALLENGES.length + '\x1b[0m');
  if (score === CHALLENGES.length) writeLine('\x1b[33m  Perfect score! Outstanding work!\x1b[0m');
}

function prevChallenge() {
  if (currentChallenge > 0) { jumpToChallenge(currentChallenge - 1); return; }
  writeLine('\x1b[90mAlready at the first challenge.\x1b[0m');
}

function resetChallenge() {
  const ch = CHALLENGES[currentChallenge];
  py.reset_name(ch.name);
  varPane.refresh();
  writeLine(`\x1b[90mReset: ${ch.name} has been cleared.\x1b[0m`);
  showChallengeInTerminal();
}

function showHelp() {
  writeLine([
    '',
    '\x1b[36m=== Python Terminal Help ===\x1b[0m',
    '\x1b[90mA real IPython shell running in your browser via Pyodide.\x1b[0m',
    '',
    '\x1b[33mChallenge Commands:\x1b[0m',
    '  \x1b[36mtest()\x1b[0m        Run tests for the current challenge',
    '  \x1b[36mnext()\x1b[0m        Go to the next challenge',
    '  \x1b[36mprev()\x1b[0m        Go to the previous challenge',
    '  \x1b[36mchallenge()\x1b[0m   Show current challenge details',
    '  \x1b[36mchallenge(5)\x1b[0m  Jump to challenge #5',
    '  \x1b[36mreset()\x1b[0m       Clear your current function',
    '',
    '\x1b[33mIPython:\x1b[0m',
    '  \x1b[36mobj?\x1b[0m / \x1b[36mobj??\x1b[0m   Help / source for obj',
    '  \x1b[36m%timeit expr\x1b[0m  Time an expression',
    '  \x1b[36m%who\x1b[0m          List your variables',
    '  \x1b[36m_\x1b[0m, \x1b[36mOut[n]\x1b[0m     Previous results',
    '',
    '\x1b[33mEditing:\x1b[0m',
    '  \x1b[36mLeft/Right\x1b[0m    Move cursor   \x1b[36mCtrl+Left/Right\x1b[0m  Move by word',
    '  \x1b[36mHome/End\x1b[0m      Line start/end (also \x1b[36mCtrl+A/E\x1b[0m)',
    '  \x1b[36mUp/Down\x1b[0m       Move between lines, then history (type a prefix to filter)',
    '  \x1b[36mTab\x1b[0m           Complete names, or indent',
    '  \x1b[36mShift+Tab\x1b[0m     Dedent',
    '  \x1b[36mAlt+Enter\x1b[0m     Insert a new line without running',
    '  \x1b[36mCtrl+K/U/W\x1b[0m    Delete to end / to start / previous word   \x1b[36mCtrl+Y\x1b[0m  Paste deleted text',
    '  \x1b[36mCtrl+C\x1b[0m        Cancel input   \x1b[36mCtrl+L\x1b[0m  Clear screen',
    '',
    '\x1b[33mWorkflow:\x1b[0m',
    '  1. Read the challenge in the panel above',
    '  2. Define your function; Enter on a blank line finishes the block',
    '  3. Type \x1b[36mtest()\x1b[0m to check your solution',
    '  4. Type \x1b[36mnext()\x1b[0m to advance',
    '',
  ].join('\n'));
}

// ============ VARIABLE EXPLORER ============
async function initVarPane() {
  const response = await fetch(VAREXPLORER_SOURCE);
  if (!response.ok) throw new Error(`Could not load ${VAREXPLORER_SOURCE} (HTTP ${response.status})`);
  const vxCall = pyodide.globals.get('load_varexplorer')(await response.text());
  varPane = new VarPane(document.getElementById('var-pane'), {
    call: (method, params) => {
      const reply = JSON.parse(vxCall(method, JSON.stringify(params || {})));
      if (reply.error) throw new Error(reply.error);
      return reply.result;
    },
  });
  varPane.modal.onHide = () => term.focus();
  varPane.start();
}

function loadPaneLayout() {
  try { return JSON.parse(localStorage.getItem(PANE_STORAGE_KEY) || '{}'); } catch (e) { return {}; }
}

function savePaneLayout(patch) {
  try { localStorage.setItem(PANE_STORAGE_KEY, JSON.stringify(Object.assign(loadPaneLayout(), patch))); } catch (e) { /* private mode */ }
}

function toggleVarPane(show) {
  const visible = show ?? document.body.classList.contains('vx-hidden');
  document.body.classList.toggle('vx-hidden', !visible);
  document.getElementById('vx-toggle').classList.toggle('active', visible);
  savePaneLayout({ visible });
  if (visible && varPane) varPane.refresh();
  if (term) term.focus();
}

function initSplitter() {
  const pane = document.getElementById('var-pane');
  const splitter = document.getElementById('splitter');
  const workspace = document.getElementById('workspace');
  const layout = loadPaneLayout();
  if (layout.width) pane.style.width = layout.width + 'px';
  if (layout.visible === false) toggleVarPane(false);

  splitter.addEventListener('pointerdown', e => {
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add('dragging');
  });
  splitter.addEventListener('pointermove', e => {
    if (!splitter.hasPointerCapture(e.pointerId)) return;
    const box = workspace.getBoundingClientRect();
    const width = Math.min(box.right - e.clientX, box.width - TERMINAL_MIN_WIDTH);
    pane.style.width = Math.max(PANE_MIN_WIDTH, width) + 'px';
  });
  splitter.addEventListener('pointerup', e => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove('dragging');
    savePaneLayout({ width: parseInt(pane.style.width, 10) });
  });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-challenge').classList.toggle('active', mode === MODE.CHALLENGE);
  document.getElementById('mode-repl').classList.toggle('active', mode === MODE.REPL);
  document.getElementById('challenge-panel').style.display = mode === MODE.CHALLENGE ? 'flex' : 'none';
  term.focus();
}

// ============ INIT ============
function showLoadError(msg) {
  const el = document.getElementById('loading');
  el.style.display = 'flex';
  el.innerHTML = `<h2 style="color:var(--red);">Failed to Load</h2>
    <p style="color:var(--muted);max-width:400px;line-height:1.6;">${msg}</p>
    <p style="color:var(--muted);margin-top:1rem;font-size:.75rem;">Check the browser console (F12) for details.</p>
    <a href="../../../hub/index.html" style="margin-top:1rem;padding:.5rem 1rem;background:var(--cyan);color:#000;border-radius:6px;text-decoration:none;font-size:.82rem;">&larr; Back to Home</a>`;
}

if (typeof Terminal === 'undefined' || typeof LineEditor === 'undefined' || typeof VarPane === 'undefined') {
  showLoadError('Could not load the terminal library (xterm.js) from CDN. This may be caused by a network issue, ad blocker, or firewall. Try disabling extensions or using a different network.');
} else if (typeof loadPyodide === 'undefined') {
  showLoadError('Could not load the Python runtime (Pyodide) from CDN. This is a ~30MB download. Try a faster connection or check if cdn.jsdelivr.net is accessible.');
} else {
  updateChallengePanel();
  initSplitter();
  initTerminal();
  initPyodide().catch(err => {
    console.error(err);
    showLoadError('Python started but IPython failed to initialize: ' + String(err && err.message || err).split('\n').pop());
  });
}
